name: Dependency verification

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run cf:build

  verify-xmtp-collector:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/xmtp-collector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/xmtp-collector/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm audit --audit-level=low
